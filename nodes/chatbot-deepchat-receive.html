<script type="text/javascript">
  $.RedBot.registerType('chatbot-deepchat-node', {
    category: 'config',
    defaults: {
      botname: {
        value: '',
        required: true
      },
      botId: {
        value: '',
        required: true,
        validate: function(value) {
          return /^[A-Za-z0-9_-]+$/.test(value);
        }
      },
      connectMode: {
        value: 'http'
      },
      heartbeat: {
        value: 30000
      },
      publicUrl: {
        value: ''
      },
      allowedOrigins: {
        value: ''
      },
      introMessage: {
        value: ''
      },
      acceptFiles: {
        value: true
      },
      cdn: {
        value: ''
      },
      timeout: {
        value: 20000
      },
      collectWindow: {
        value: 400
      },
      store: {
        value: '',
        type: 'chatbot-context-store',
        required: false
      },
      debug: {
        value: false
      },
      storeMessages: {
        value: true
      },
      enableMissionControl: {
        value: false
      },
      inspectMessages: {
        value: true
      },
      chatbotId: {
        value: ''
      }
    },
    oneditprepare: function() {
      var node = this;
      var nodeRedUrl = $.RedBot.getNodeRedUrl();

      var updateWidgetLink = function() {
        var botId = $('#node-config-input-botId').val();
        if (botId != null && botId !== '') {
          $('.deepchat-widget-link')
            .attr('href', nodeRedUrl + 'redbot/deepchat/' + encodeURIComponent(botId) + '/widget')
            .text('/redbot/deepchat/' + botId + '/widget')
            .show();
        } else {
          $('.deepchat-widget-link').hide();
        }
      };
      $('#node-config-input-botId').on('change keyup', updateWidgetLink);
      updateWidgetLink();

      var updateConnectMode = function() {
        if ($('#node-config-input-connectMode').val() === 'websocket') {
          $('.form-row-http-mode').hide();
          $('.form-row-websocket-mode').show();
        } else {
          $('.form-row-http-mode').show();
          $('.form-row-websocket-mode').hide();
        }
      };
      $('#node-config-input-connectMode').on('change', updateConnectMode);
      updateConnectMode();

      $.get(nodeRedUrl + 'redbot/globals')
        .done(function(response) {
          if (response != null && response.deepchat != null && response.deepchat[node.botname] != null) {
            $('#node-config-input-botname').prop('readonly', true);
            $('.form-editable').hide();
            $('.form-warning').show();
            $('.form-warning .bot-name').html('"' + node.botname + '"');
          }
          if (!response.missionControl) {
            $('.form-row-not-mission-control').show();
            $('.form-row-mission-control').hide();
            $('#node-config-input-enableMissionControl')
              .prop('disabled', true)
              .prop('checked', false);
          }
        });
      $('#node-config-input-enableMissionControl')
        .change(function() {
          if ($(this).is(':checked')) {
            $('.form-row-not-mission-control').hide();
            $('.form-row-mission-control').show();
          } else {
            $('.form-row-not-mission-control').show();
            $('.form-row-mission-control').hide();
          }
        });
      $('#node-config-input-enableMissionControl')
        .change(function() {
          if ($(this).is(':checked')) {
            var chatbotId = $('#node-config-input-chatbotId').val();
            if (chatbotId == null || chatbotId === '') {
              $.ajax({ url: '/mc/chatbotIdGenerator' })
                .then(function(res) {
                  $('#node-config-input-chatbotId').val(res);
                });
            }
          }
        });
    },
    paletteName: 'Deep Chat Bot',
    label: function () {
      return this.botname;
    }
  });
</script>

<script type="text/x-red" data-help-name="chatbot-deepchat-node">
  <p><a href="https://deepchat.dev/">Deep Chat</a> is a web component that embeds a chat widget in any web page.
  The <strong>Deep Chat</strong> connector turns a RedBot flow into the backend of that widget: no external service,
  no webhook to register, no token &mdash; the widget talks straight to <strong>Node-RED</strong>.</p>

  <h4>Endpoints</h4>
  <p>Each bot configuration declares a <strong>Bot ID</strong> which becomes part of these endpoints:</p>
  <ul>
    <li><code>POST /redbot/deepchat/&lt;botId&gt;</code> &mdash; the endpoint the widget connects to in
      <em>HTTP</em> mode. It stays available in <em>WebSocket</em> mode (it's the only way to upload a file) but
      it answers with an empty array, the flow replies over the socket.</li>
    <li><code>GET /redbot/deepchat/&lt;botId&gt;/ws</code> &mdash; the socket endpoint, mounted only in
      <em>WebSocket</em> mode.</li>
    <li><code>GET /redbot/deepchat/&lt;botId&gt;/widget</code> &mdash; a ready made test page with a widget already
      wired to the bot in the mode it is configured with. Open it in a browser to try the flow.</li>
  </ul>
  <p>Media sent by the flow is served from <code>/redbot/deepchat/&lt;botId&gt;/files/&lt;id&gt;</code> and expires
  after one hour.</p>

  <h4>Embedding the widget</h4>
  <p>Add the Deep Chat script to your page and point it at the endpoint. The <code>chatId</code> identifies the
  conversation and must be stable for the same user (generate it once and keep it in <em>localStorage</em>):</p>
  <pre><code class="language-html">&lt;script type="module" src="https://cdn.jsdelivr.net/npm/deep-chat@2.5.1/dist/deepChat.bundle.js"&gt;&lt;/script&gt;
&lt;deep-chat id="chat"&gt;&lt;/deep-chat&gt;
&lt;script type="module"&gt;
  const chat = document.getElementById('chat');
  chat.connect = {
    url: 'https://mybot.example.com/redbot/deepchat/my-bot',
    method: 'POST',
    additionalBodyProps: { chatId: 'a-stable-id', userId: 'a-stable-id' }
  };
  chat.requestBodyLimits = { maxMessages: 1 };
&lt;/script&gt;</code></pre>
  <p>In <em>WebSocket</em> mode the same page connects to the socket endpoint instead. The conversation is
  identified by the query string of the upgrade request, Deep Chat doesn't add
  <code>additionalBodyProps</code> to a socket frame:</p>
  <pre><code class="language-html">&lt;script type="module"&gt;
  const chatId = 'a-stable-id';
  chat.connect = {
    url: 'wss://mybot.example.com/redbot/deepchat/my-bot/ws?chatId=' + chatId + '&amp;userId=' + chatId,
    websocket: true
  };
&lt;/script&gt;</code></pre>
  <p>If the page is served by a different host, list its origin in <strong>Allowed origins</strong> and set
  <strong>Public URL</strong> so that media links are absolute. CORS doesn't apply to WebSockets: the same list
  is checked on the handshake and a connection from an origin that is not allowed is refused with a
  <code>401</code>.</p>
  <p>A reverse proxy in front of Node-RED must be configured to forward the <code>Upgrade</code> and
  <code>Connection</code> headers, otherwise the handshake never reaches the bot.</p>

  <h4>Request and response</h4>
  <p>The widget POSTs <code>{ "messages": [{ "role": "user", "text": "..." }], "chatId": "..." }</code>. The
  connector holds the response open while the flow answers and replies with the array of messages the flow
  produced. Anything sent after the timeout (for instance by a <em>Push Message</em> node) is buffered and
  delivered with the next message of the user.</p>
  <p>Over a WebSocket the widget sends the same body as a stringified frame and the flow answers with one frame
  per message, whenever it wants: there is no timeout and no collecting window. Messages produced while nobody
  is connected are buffered per conversation and delivered right after the next handshake. Only one socket per
  conversation is kept: a second one (another tab, or a reconnection) replaces the previous.</p>

  <h4>Supported messages</h4>
  <ul>
    <li><strong>Message</strong> &mdash; plain text.</li>
    <li><strong>Inline buttons</strong> / <strong>Quick Replies</strong> &mdash; rendered as Deep Chat suggestion
      buttons, clicking one sends back the <em>value</em> of the button.</li>
    <li><strong>Photo</strong>, <strong>Video</strong>, <strong>Audio</strong>, <strong>Document</strong> &mdash;
      served from the bot files endpoint.</li>
    <li><strong>Location</strong> &mdash; rendered as a link to OpenStreetMap.</li>
  </ul>
  <p>Files attached by the user are forwarded to the flow as <em>photo</em>, <em>audio</em>, <em>video</em> or
  <em>document</em> messages (up to 20MB), the text typed along with them becomes the caption. This works in
  <em>HTTP</em> mode only: Deep Chat uploads files as a multipart request, which has no equivalent on a socket,
  so the attachment button is hidden in <em>WebSocket</em> mode. Media sent by the flow works in both modes.</p>

  <h4>Development vs Production</h4>
  <p><code>Deep Chat Receiver</code> and <code>Deep Chat Sender</code> nodes have a double bot configuration for
  <em>development</em> and <em>production</em>. By default the <em>development</em> configuration is used, to switch
  to <em>production</em> set the <code>environment</code> global variable to <code>"production"</code> in
  <em>settings.js</em>.</p>
</script>

<script type="text/javascript">
  $.RedBot.registerType('chatbot-deepchat-send', {
    category: $.RedBot.config.name + ' Platforms',
    color: '#FFCC66',
    defaults: {
      bot: {
        value: '',
        type: 'chatbot-deepchat-node',
        required: true
      },
      botProduction: {
        value: '',
        type: 'chatbot-deepchat-node',
        required: false
      },
      track: {
        value: false
      },
      passThrough: {
        value: false
      },
      errorOutput: {
        value: false
      },
      outputs: {
        value: 0
      }
    },
    inputs: 1,
    outputs: 1,
    icon: 'deepchat.svg',
    paletteLabel: 'Deep Chat Sender',
    label: function () {
      return 'Deep Chat Sender';
    },
    inputLabels: 'Chat flow',
    outputLabels: function(idx) {
      if (idx === 0 && this.track) {
        return 'Track';
      } else if (idx === 0 && this.passThrough) {
        return 'Pass through';
      } else if (idx === 1) {
        return 'Error';
      }
    },
    oneditprepare: function() {
      $('#node-input-passThrough')
        .click(function() {
          if ($(this).is(':checked')) {
            $('#node-input-track').prop('checked', false);
          }
        });
      $('#node-input-track')
        .click(function() {
          if ($(this).is(':checked')) {
            $('#node-input-passThrough').prop('checked', false);
          }
        });
    },
    oneditsave: function() {
      var count = 0;
      var track = $('#node-input-track').is(':checked');
      var passThrough = $('#node-input-passThrough').is(':checked');
      var errorOutput = $('#node-input-errorOutput').is(':checked');
      if (track || passThrough) {
        count = 1;
      }
      if (errorOutput) {
        count += 1;
      }
      this.outputs = count;
    }
  });
</script>
