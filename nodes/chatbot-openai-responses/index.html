<script type="text/javascript">
  const gptTryParse = str => {
    let parsed;
    try {
      parsed = JSON.parse(str);

      return parsed;
    } catch(e) {
      return null;
    }
  };

  const gptCountFunctions = parsed => {
    if (parsed && Array.isArray(parsed.tools)) {
      return parsed.tools.filter(t => t.type === 'function').length;
    }
    return 0;
  };

  const gptIsStoredPromptOnly = parsed =>
    parsed && parsed.prompt && parsed.prompt.id && !Array.isArray(parsed.tools);


  RED.nodes.registerType('chatbot-openai-responses',{
      category: $.RedBot.config.name + ' Platforms',
      color: '#FFCC66',
      defaults: {
        openAIKey: {value: '', type: 'chatbot-open-ai-key' },
        name: { value:'' },
        prompt: { value: '' },
        functions: { value: [] },
        outputs: { value: 1 }
      },
      inputs: 1,
      outputs: 1,
      icon: 'chat-gpt-logo.svg',
      paletteLabel: 'ChatGPT Responses',
      label: function() {
        return this.name || 'ChatGPT Responses';
      },
      oneditprepare: function() {
        const node = this;
        node.editor = RED.editor.createEditor({
          id: 'node-input-example-editor',
          mode: 'ace/mode/json',
          value: this.prompt
        });

        const $list = $('#node-input-functions-list');
        const $status = $('#node-input-functions-status');
        const $button = $('#node-input-functions-refresh');

        const renderList = (functions) => {
          $list.empty();
          if (!functions || functions.length === 0) {
            $list.append('<div style="color:#999;font-style:italic;">No function tools yet. Click Refresh after entering a prompt id.</div>');
            return;
          }
          functions.forEach((f) => {
            const desc = f.description ? ' — <span style="color:#999;">' + $('<div/>').text(f.description).html() + '</span>' : '';
            $list.append('<div><i class="fa fa-cog" style="color:#888;margin-right:6px;"></i><strong>' + $('<div/>').text(f.name).html() + '</strong>' + desc + '</div>');
          });
        };

        const updateButtonState = () => {
          const parsed = gptTryParse(node.editor.getValue());
          const isStoredPrompt = gptIsStoredPromptOnly(parsed);
          const hasKey = !!$('#node-input-openAIKey').val();
          $button.prop('disabled', !(isStoredPrompt && hasKey));
          if (!isStoredPrompt) {
            $status.text('Refresh available when prompt JSON has prompt.id and no inline tools.').css('color', '#999');
          } else if (!hasKey) {
            $status.text('Select an OpenAI API key first.').css('color', '#999');
          } else {
            $status.text('').css('color', '#999');
          }
        };

        renderList(node.functions);
        updateButtonState();

        node.editor.on('input', updateButtonState);
        $('#node-input-openAIKey').on('change', updateButtonState);

        $button.on('click', (ev) => {
          ev.preventDefault();
          const parsed = gptTryParse(node.editor.getValue());
          if (!gptIsStoredPromptOnly(parsed)) return;
          const apiKeyNodeId = $('#node-input-openAIKey').val();
          if (!apiKeyNodeId) return;

          $button.prop('disabled', true);
          $status.text('Probing OpenAI…').css('color', '#999');

          $.ajax({
            url: 'chatbot-openai-responses/probe',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
              apiKeyNodeId,
              promptId: parsed.prompt.id,
              version: parsed.prompt.version
            })
          }).done((data) => {
            node.functions = Array.isArray(data.functions) ? data.functions : [];
            renderList(node.functions);
            $status.text('Found ' + node.functions.length + ' function tool(s). Click Done to apply.').css('color', '#3a7a3a');
            updateButtonState();
          }).fail((xhr) => {
            const msg = (xhr.responseJSON && xhr.responseJSON.error) || xhr.statusText || 'unknown error';
            $status.text('Error: ' + msg).css('color', '#a33');
            updateButtonState();
          });
        });
      },
      oneditsave: function() {
        this.prompt = this.editor.getValue();
        this.editor.destroy();
        delete this.editor;

        const parsed = gptTryParse(this.prompt);
        let functionCount;
        if (parsed && Array.isArray(parsed.tools)) {
          // legacy: full prompt JSON pasted, tools are inline
          functionCount = gptCountFunctions(parsed);
          this.functions = parsed.tools
            .filter(t => t.type === 'function')
            .map(t => ({ name: t.name, description: t.description }));
        } else {
          // stored-prompt mode: use the discovered functions list
          functionCount = (this.functions || []).length;
        }
        this.outputs = 1 + functionCount + 1; // response + N functions + error
      },
      oneditcancel: function() {
        this.editor.destroy();
        delete this.editor;
      },
      outputLabels: function(index) {
        if (index === 0) {
          return 'ChatGPT response';
        } else if (index === (this.outputs - 1)) {
          return 'ChatGPT error';
        } else {
          if (Array.isArray(this.functions) && this.functions[index - 1]) {
            return 'Function call ' + this.functions[index - 1].name;
          }
          const parsed = gptTryParse(this.prompt);
          if (parsed && Array.isArray(parsed.tools)) {
            const funcs = parsed.tools.filter(t => t.type === 'function');
            if (index <= funcs.length) {
              return 'Function call ' + funcs[index - 1].name;
            }
          }
        }
      }
  });
</script>

    <div style="margin-top:6px;display:flex;align-items:center;gap:8px;">
      <button type="button" id="node-input-functions-refresh" class="red-ui-button">

    <div style="font-size: 0.9em;line-height: normal;color: #999999;margin-top: 5px;">

  </div>
</script>

<script type="text/html" data-help-name="chatbot-openai-responses"><p>Used to send a message to OpenAI&#39;s <a href="https://platform.openai.com/docs/api-reference/responses/create">Responses API</a> and receive a generated answer back into the flow. The node also supports <strong>function calling</strong>, <strong>conversation state</strong> and <strong>image / file attachments</strong>.</p>
<p>The text sent to ChatGPT is taken from the upstream <code>Message</code> payload (<code>msg.payload.content</code>), the response is forwarded out of the first pin and can be sent back to the user as a regular <code>Message</code>.</p>
<p>The prompt design (model, instructions, tools, variables, …) is <strong>not</strong> configured field by field in the editor: instead the JSON exported from the <a href="https://platform.openai.com/playground/prompts?models=gpt-4.1">Prompts Playground</a> is pasted in the <code>Prompt</code> text area. Any change made in the Playground (a new tool, a different model, a longer instruction) is therefore propagated by simply copying and pasting the updated JSON.</p>
<p>The example flow <code>ChatGPT example.json</code> ships a working setup with one function tool (<code>get_temperature</code>), a Telegram receiver / sender pair and a typing indicator.</p>
<h2 id="using-chatgpt-tools">Using ChatGPT tools</h2>
<p>ChatGPT Responses dynamically grows its output pins based on the <code>tools</code> array declared in the <code>Prompt</code> JSON: one pin per <code>function</code> tool is created, plus the standard <em>response</em> pin (first) and <em>error</em> pin (last).</p>

<p>In the screenshot above:</p>
<ul>
<li><p>the <strong>Telegram Receiver</strong> forwards the incoming message both to the <code>ChatGPT Responses</code> node and to a <code>Waiting…</code> message that gives the user immediate feedback while the model is thinking</p>
</li>
<li><p>the <code>ChatGPT Responses</code> node exposes three pins because the prompt declares one function tool named <code>get_temperature</code>:</p>
<ul>
<li><p><strong>pin 1 — ChatGPT response</strong>: emits the text answer produced by the model, routed to a <code>Message</code> / <code>Params</code> / <code>Telegram Sender</code> chain</p>
</li>
<li><p><strong>pin 2 — Function call</strong> <strong><code>get_temperature</code></strong>: fires whenever the model decides to call the <code>get_temperature</code> tool. The downstream <code>Get temperature</code> function node resolves the value (for example by calling an external weather API) and <strong>loops the result back into the input of</strong> <strong><code>ChatGPT Responses</code></strong> so the model can produce the final natural-language answer</p>
</li>
<li><p><strong>pin 3 — ChatGPT error</strong>: emits the error returned by the OpenAI API (rate limits, invalid prompt, network errors, …)</p>
</li>
</ul>
</li>
</ul>
<p>To answer a function call, the downstream node must:</p>
<ol>
<li><p>compute the result and place it on <code>msg.payload</code> (any JSON-serializable value)</p>
</li>
<li><p><strong>leave</strong> <strong><code>msg[&#39;chatgpt-function-call&#39;]</code></strong> <strong>untouched</strong> — it carries the <code>call_id</code> and <code>previous_response_id</code> the node needs to resume the conversation with the model</p>
</li>
<li><p>wire its output back into the <strong>input</strong> of the same <code>ChatGPT Responses</code> node</p>
</li>
</ol>
<p>For example, the <code>Get temperature</code> function node reads the city argument provided by the model and writes the temperature back:</p>
<pre><code class="language-javascript">// msg.payload contains the arguments parsed from the model, e.g. { city: &#39;Milan&#39; }
const city = msg.payload.city;

msg.payload = { city, temperature: 21, unit: &#39;C&#39; };
return msg;
</code></pre>
<p>The same pattern scales to any number of tools: declare them in the prompt JSON, wire one branch per tool and loop each branch back to the <code>ChatGPT Responses</code> input.</p>
<h2 id="conversation-state">Conversation state</h2>
<p>ChatGPT Responses keeps the conversation alive across messages by storing the <code>response.id</code> of the latest OpenAI call into the flow context, scoped by <code>chatId</code>. The next call automatically reuses it as <code>previous_response_id</code>, so the model sees the full history without the chatbot having to resend it.</p>
<p>If the upstream message does not carry a <code>chatId</code> (for example a broadcast or a manual <code>Inject</code>), the node will log a warning and the conversation will be stateless.</p>
<p>To inject extra context at runtime (without changing the saved prompt) use <code>msg.context</code>:</p>
<pre><code class="language-javascript">msg.context = {
  system: &#39;The user is a premium customer&#39;,
  assistant: [&#39;Previously the user asked about shipping costs&#39;],
  user: &#39;My order number is #12345&#39;
};
return msg;
</code></pre>
<p>Each key accepts a single string or an array of strings. The strings are appended to the <code>input</code> array of the OpenAI request as additional turns.</p>
<hr>
<h2 id="prompt-variables">Prompt variables</h2>
<p>If the prompt declares variables (using the <code>{{variable}}</code> syntax in the Playground), they can be filled at runtime from <code>msg.variables</code>:</p>
<pre><code class="language-javascript">msg.variables = {
  firstName: &#39;John&#39;,
  productName: &#39;REDBot&#39;
};
return msg;
</code></pre>
<p>The values are merged into the <code>prompt.variables</code> field of the OpenAI request, overriding any value stored in the saved prompt.</p>
<h2 id="attachments">Attachments</h2>
<p>When <code>msg.attachments</code> is set (typically by an upstream <code>Image</code> or <code>Document</code> receiver), each attachment is uploaded to OpenAI via the <a href="https://platform.openai.com/docs/api-reference/files/create">Files API</a> with <code>purpose: &#39;assistants&#39;</code> and then attached to the user turn as <code>input_image</code>. This enables vision use-cases (let the user send a photo and ask ChatGPT to describe it).</p>
<p><code>msg.attachments</code> can be a single attachment or an array; each item must expose <code>.content</code> (Buffer) and <code>.filename</code>.</p>

<td><code>context.user</code></td>
<td>string / array of [string]</td>
<td>Additional <code>user</code>-flavoured turns injected before the user message</td>
</tr>
<tr>
<td><code>variables</code></td>
<td>object</td>
<td>Values for the variables declared in the saved prompt. Merged into <code>prompt.variables</code></td>
</tr>
<tr>
<td><code>chatgpt-function-call</code></td>
<td>object</td>
<td>Set by the node itself on the tool pins. Must be left untouched when looping the response back to the node</td>
</tr>
</tbody></table>
<h2 id="output">Output</h2>
<p>The node exposes a dynamic number of output pins, calculated from the <code>tools</code> declared in the prompt JSON:</p>
<table>
<thead>
<tr>
<th>Pin</th>
<th>Name</th>
<th>Description</th>
</tr>
</thead>
<tbody><tr>
<td>1</td>
<td>ChatGPT response</td>
<td>Text answer produced by the model. <code>msg.payload = { message: &#39;…&#39; }</code> — ready to be fed into a <code>Message</code> node</td>
</tr>
<tr>
<td>2 … N</td>
<td>Function call <em>name</em></td>
<td>One pin per <code>function</code> tool. <code>msg.payload</code> holds the parsed arguments produced by the model. <code>msg[&#39;chatgpt-function-call&#39;]</code> carries the metadata needed to resume the conversation</td>
</tr>
<tr>
<td>Last</td>
<td>ChatGPT error</td>
<td>Emitted only when the OpenAI API returns an error. <code>msg.payload</code> holds the original error object</td>
</tr>
</tbody></table>
<p>If the model produces both a text answer and one or more function calls in the same turn, all the relevant pins fire in parallel.</p>
<h2 id="example">Example</h2>
<p>The <code>ChatGPT example.json</code> flow shipped with REDBot wires a minimal Telegram chatbot with one function tool:</p>
<ol start="4">
<li><p>import the flow from the <em>Examples</em> menu of Node-RED</p>
</li>
<li><p>open the <code>OpenAI key</code> config node and paste a valid API key</p>
</li>
<li><p>open the <code>Telegram Receiver</code> / <code>Telegram Sender</code> nodes and connect them to a Telegram bot token</p>
</li>
<li><p>deploy and chat with the bot — asking for example <em>&quot;What is the temperature in Milan?&quot;</em> will trigger the <code>get_temperature</code> tool, the result is fed back to the model and the final natural-language answer is sent to the user</p>
</li>
</ol>
